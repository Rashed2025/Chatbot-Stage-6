name: CI/CD Pipeline - Lint, Test, Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_cd_pipeline:
    name: Lint → Test → Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Code Linting (flake8)
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        flake8 . --exclude=venv --max-line-length=100

    - name: Run Unit Tests (pytest)
      run: |
        pip install pytest
        pytest tests || echo "Warning: Tests failed or no test suite present"

    - name: Check Required Ports on Azure VM (5000, 8501)
      run: |
        sudo apt-get install -y netcat
        nc -zv ${{ secrets.VM_HOST }} 5000 || echo "Warning: Port 5000 not reachable"
        nc -zv ${{ secrets.VM_HOST }} 8501 || echo "Warning: Port 8501 not reachable"

    - name: Upload Files to Azure VM
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "/home/azureuser/chatbot-stage-6"
        strip_components: 1

    - name: Restart Backend/Frontend Service (app.service)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          sudo systemctl restart app.service
